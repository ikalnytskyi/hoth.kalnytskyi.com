---

- name: Generate systemd mount unit name
  ansible.builtin.command: systemd-escape -p --suffix=mount {{ item.where }}
  register: storage_systemd_escape
  changed_when: false

- name: Set systemd mount unit name
  ansible.builtin.set_fact:
    storage_unit_name: "{{ storage_systemd_escape.stdout }}"

- name: Render systemd mount unit
  ansible.builtin.template:
    src: systemd.mount.j2
    dest: /etc/systemd/system/{{ storage_unit_name }}
    mode: u=rw,g=r,o=r
  become: true

- name: Start systemd mount unit and on every reboot
  ansible.builtin.systemd:
    name: "{{ storage_unit_name }}"
    enabled: true
    state: started
    daemon_reload: true
  become: true

- name: Ensures permissions of the mount point
  ansible.builtin.file:
    path: "{{ item.where }}"
    state: directory
    mode: "{{ item.directory_mode }}"
  when: item.directory_mode is defined
  become: true
